ont-weight="600" fill="#111">150</text><text x="300.0" y="415.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="21" text-anchor="middle" font-weight="400" fill="#111">暗号化クラウドDBに保存</text><path d="M300 445 V495" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="85" y="495" width="430" height="110" fill="white" stroke="#111" stroke-width="1.8"/><text x="300.0" y="543.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#111">160</text><text x="300.0" y="575.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="21" text-anchor="middle" font-weight="400" fill="#111">AIによる処理と学習</text><path d="M300 605 V655" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="85" y="655" width="430" height="110" fill="white" stroke="#111" stroke-width="1.8"/><text x="300.0" y="687.5" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#111">160</text><text x="300.0" y="719.5" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="21" text-anchor="middle" font-weight="400" fill="#111">航行・エネルギー効率・</text><text x="300.0" y="750.5" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="21" text-anchor="middle" font-weight="400" fill="#111">物流計画の改善</text><rect x="610" y="95" width="425" height="720" fill="white" stroke="#111" stroke-width="1.8" stroke-dasharray="9 6"/><text x="822" y="140" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="21" text-anchor="middle" font-weight="400" fill="#111">実装上の提案</text><rect x="647" y="200" width="350" height="90" fill="white" stroke="#111" stroke-width="1.8"/><text x="822" y="254" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="400" fill="#111">データ品質の検証</text><path d="M822 290 V355" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="647" y="355" width="350" height="90" fill="white" stroke="#111" stroke-width="1.8"/><text x="822" y="409" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="400" fill="#111">候補モデルの評価</text><path d="M822 445 V510" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="647" y="510" width="350" height="90" fill="white" stroke="#111" stroke-width="1.8"/><text x="822" y="564" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="400" fill="#111">更新の承認とバージョン管理</text><path d="M822 600 V665" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="647" y="665" width="350" height="90" fill="white" stroke="#111" stroke-width="1.8"/><text x="822" y="719" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="400" fill="#111">運用監視・ロールバック</text><text x="56" y="883" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#111">破線内はシステム設計上の提案であり、明細書の記載事項ではありません。</text><text x="56" y="909" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#111">原文はモデル配置、学習スケジュール、更新の承認方法を指定していません。</text><path d="M56 931 H1064" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter"/><text x="560" y="969" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="24" text-anchor="middle" font-weight="600" fill="#111">FIG. 6   運用データとAIの改善</text><text x="560" y="1002" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#111">ポートフォリオ用説明図</text></svg>
