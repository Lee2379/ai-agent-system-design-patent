<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1030" viewBox="0 0 1120 1030" role="img" aria-labelledby="title desc" xml:lang="en"><title id="title">FIG. 4 — Drone functional components</title><desc id="desc">System drawing based on the patent specification. Reference numbers match the drawing index; not an original patent-office drawing.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#111" stroke-width="1.3"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#111" stroke-width="1.3"/></marker></defs><rect width="1120" height="1030" fill="white"/><text x="56" y="43" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#111">AI AGENT / SYSTEM DESIGN</text><text x="1064" y="43" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="16" text-anchor="end" font-weight="400" fill="#111">4 / 6</text><path d="M56 60 H1064" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter"/><rect x="360" y="100" width="400" height="100" fill="white" stroke="#111" stroke-width="1.8"/><text x="560.0" y="143.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#111">120 / 130</text><text x="560.0" y="175.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">AI control / satellite link</text><rect x="110" y="270" width="900" height="540" fill="white" stroke="#111" stroke-width="1.8"/><text x="155" y="311" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="24" text-anchor="start" font-weight="400" fill="#111">140  Autonomous drone</text><path d="M560 200 V345" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)" marker-start="url(#start)"/><rect x="355" y="345" width="410" height="100" fill="white" stroke="#111" stroke-width="1.8"/><text x="560.0" y="388.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#111">144</text><text x="560.0" y="420.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">Communication modules</text><rect x="150" y="510" width="230" height="110" fill="white" stroke="#111" stroke-width="1.8"/><text x="265.0" y="558.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#111">141</text><text x="265.0" y="590.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="400" fill="#111">GPS positioning</text><rect x="445" y="510" width="230" height="110" fill="white" stroke="#111" stroke-width="1.8"/><text x="560.0" y="542.5" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#111">142</text><text x="560.0" y="574.5" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="400" fill="#111">Object-detection</text><text x="560.0" y="605.5" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="400" fill="#111">sensors</text><rect x="740" y="510" width="230" height="110" fill="white" stroke="#111" stroke-width="1.8"/><text x="855.0" y="558.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#111">143</text><text x="855.0" y="590.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="400" fill="#111">Cameras</text><rect x="355" y="680" width="410" height="90" fill="white" stroke="#111" stroke-width="1.8"/><text x="560.0" y="718.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#111">145</text><text x="560.0" y="750.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">Electric propulsion</text><text x="56" y="883" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#111">Functional component inventory. Placement, dimensions, wiring, and control implementation are unspecified.</text><text x="56" y="909" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#111">GPS supplies positioning; satellite communication provides a separate information-exchange function.</text><path d="M56 931 H1064" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter"/><text x="560" y="969" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="24" text-anchor="middle" font-weight="600" fill="#111">FIG. 4   Drone functional components</text><text x="560" y="1002" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#111">System design drawing</text></svg>
