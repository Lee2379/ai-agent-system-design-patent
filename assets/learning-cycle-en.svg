o, sans-serif" font-size="17" fill="#536d81" font-weight="400" text-anchor="start">Retained operational records</text><path d="M819 282 H860" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><rect x="871" y="209" width="351" height="143" rx="14" fill="white" stroke="#d5e1e8"/><g transform="translate(920 257) scale(0.63)" stroke="#087f83" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="9"/><circle cx="-28" cy="-22" r="6"/><circle cx="28" cy="-22" r="6"/><circle cx="-28" cy="24" r="6"/><circle cx="28" cy="24" r="6"/><path d="M-8 -6 L-22 -17 M8 -6 L22 -17 M-8 6 L-22 19 M8 6 L22 19"/></g><text x="962" y="253" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="23" fill="#17344d" font-weight="650" text-anchor="start">Improve</text><text x="893" y="296" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="17" fill="#536d81" font-weight="400" text-anchor="start">Navigation and energy efficiency</text><text x="893" y="323" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="17" fill="#536d81" font-weight="400" text-anchor="start">Logistics planning</text><text x="53" y="426" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#4668c8" font-weight="700" text-anchor="start">PROPOSED IMPLEMENTATION PROCESS</text><rect x="32" y="451" width="283" height="114" rx="12" fill="white" stroke="#ccd7ed"/><text x="52" y="484" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#4668c8" font-weight="700" text-anchor="start">01</text><text x="52" y="517" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="22" fill="#17344d" font-weight="650" text-anchor="start">Validate data</text><text x="52" y="545" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#536d81" font-weight="400" text-anchor="start">Time, gaps, provenance</text><path d="M319 508 H336" fill="none" stroke="#4668c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#4668c8)"/><rect x="343" y="451" width="283" height="114" rx="12" fill="white" stroke="#ccd7ed"/><text x="363" y="484" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#4668c8" font-weight="700" text-anchor="start">02</text><text x="363" y="517" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="22" fill="#17344d" font-weight="650" text-anchor="start">Evaluate model</text><text x="363" y="545" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#536d81" font-weight="400" text-anchor="start">Compare across scenarios</text><path d="M630 508 H647" fill="none" stroke="#4668c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#4668c8)"/><rect x="654" y="451" width="283" height="114" rx="12" fill="white" stroke="#ccd7ed"/><text x="674" y="484" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#4668c8" font-weight="700" text-anchor="start">03</text><text x="674" y="517" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="22" fill="#17344d" font-weight="650" text-anchor="start">Approve release</text><text x="674" y="545" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#536d81" font-weight="400" text-anchor="start">Version and rollback</text><path d="M941 508 H958" fill="none" stroke="#4668c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#4668c8)"/><rect x="965" y="451" width="283" height="114" rx="12" fill="white" stroke="#ccd7ed"/><text x="985" y="484" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#4668c8" font-weight="700" text-anchor="start">04</text><text x="985" y="517" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="22" fill="#17344d" font-weight="650" text-anchor="start">Monitor</text><text x="985" y="545" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#536d81" font-weight="400" text-anchor="start">Review behavior changes</text><path d="M1180 565 V608 H156 V575" fill="none" stroke="#4668c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#4668c8)"/><rect x="407" y="589" width="447" height="37" rx="4" fill="#f4f7fa" stroke="#f4f7fa"/><text x="630" y="614" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="18" fill="#4668c8" font-weight="500" text-anchor="middle">Operational results inform the next review</text><text x="40" y="676" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="16" fill="#536d81" font-weight="400" text-anchor="start">The source describes continuous learning; it does not specify model-update timing or deployment procedures.</text></svg>