<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="864" viewBox="0 0 1280 864" role="img" aria-labelledby="title desc" lang="en"><title id="title">Separate responsibilities. Connected decisions.</title><desc id="desc">A conceptual interaction between the customer, fleet coordination, network agents, and drone.</desc><defs><marker id="087f83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087f83"/></marker><marker id="4668c8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4668c8"/></marker><marker id="ac6b17" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ac6b17"/></marker><marker id="536d81" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536d81"/></marker></defs><rect x="1" y="1" width="1278" height="862" rx="20" fill="#f4f7fa" stroke="#d5e1e8"/><text x="40" y="43" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#087f83" font-weight="700" text-anchor="start">03 / AGENT COORDINATION</text><text x="40" y="88" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="32" fill="#17344d" font-weight="700" text-anchor="start">Separate responsibilities. Connected decisions.</text><text x="40" y="123" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="18" fill="#536d81" font-weight="400" text-anchor="start">A conceptual interaction between the customer, fleet coordination, network agents, and drone.</text><rect x="49" y="157" width="272" height="88" rx="12" fill="white" stroke="#d5e1e8"/><text x="185" y="191" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="21" fill="#536d81" font-weight="650" text-anchor="middle">Customer platform</text><text x="185" y="223" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="16" fill="#536d81" font-weight="400" text-anchor="middle">Request and receive</text><path d="M185 248 V695" fill="none" stroke="#c6d4dd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><rect x="354" y="157" width="272" height="88" rx="12" fill="white" stroke="#d5e1e8"/><text x="490" y="191" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="21" fill="#4668c8" font-weight="650" text-anchor="middle">Hierarchical AI</text><text x="490" y="223" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="16" fill="#536d81" font-weight="400" text-anchor="middle">Assign and route</text><path d="M490 248 V695" fill="none" stroke="#c6d4dd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><rect x="659" y="157" width="272" height="88" rx="12" fill="white" stroke="#d5e1e8"/><text x="795" y="191" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="21" fill="#087f83" font-weight="650" text-anchor="middle">Network AI</text><text x="795" y="223" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="16" fill="#536d81" font-weight="400" text-anchor="middle">Exchange and coordinate</text><path d="M795 248 V695" fill="none" stroke="#c6d4dd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><rect x="964" y="157" width="272" height="88" rx="12" fill="white" stroke="#d5e1e8"/><text x="1100" y="191" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="21" fill="#ac6b17" font-weight="650" text-anchor="middle">Autonomous drone</text><text x="1100" y="223" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="16" fill="#536d81" font-weight="400" text-anchor="middle">Navigate and sense</text><path d="M1100 248 V695" fill="none" stroke="#c6d4dd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><circle cx="185" cy="290" r="4" fill="#4668c8" stroke="none"/><path d="M185 290 H490" fill="none" stroke="#4668c8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#4668c8)"/><rect x="220.5" y="256" width="234" height="27" rx="4" fill="#f4f7fa" stroke="#f4f7fa"/><text x="337.5" y="277" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="17" fill="#17344d" font-weight="500" text-anchor="middle">Request + destination</text><circle cx="490" cy="351" r="4" fill="#4668c8" stroke="none"/><path d="M490 351 H795" fill="none" stroke="#4668c8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#4668c8)"/><rect x="540.5" y="317" width="204" height="27" rx="4" fill="#f4f7fa" stroke="#f4f7fa"/><text x="642.5" y="338" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="17" fill="#17344d" font-weight="500" text-anchor="middle">Assignment + route</text><circle cx="795" cy="412" r="4" fill="#087f83" stroke="none"/><path d="M795 412 H1100" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><rect x="840.5" y="378" width="214" height="27" rx="4" fill="#f4f7fa" stroke="#f4f7fa"/><text x="947.5" y="399" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="17" fill="#17344d" font-weight="500" text-anchor="middle">Mission information</text><circle cx="1100" cy="473" r="4" fill="#ac6b17" stroke="none"/><path d="M1100 473 H795" fill="none" stroke="#ac6b17" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ac6b17)"/><rect x="850.5" y="439" width="194" height="27" rx="4" fill="#f4f7fa" stroke="#f4f7fa"/><text x="947.5" y="460" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="17" fill="#17344d" font-weight="500" text-anchor="middle">Position + status</text><circle cx="795" cy="534" r="4" fill="#087f83" stroke="none"/><path d="M795 534 H490" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><rect x="545.5" y="500" width="194" height="27" rx="4" fill="#f4f7fa" stroke="#f4f7fa"/><text x="642.5" y="521" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="17" fill="#17344d" font-weight="500" text-anchor="middle">Coordination data</text><circle cx="490" cy="595" r="4" fill="#4668c8" stroke="none"/><path d="M490 595 H1100" fill="none" stroke="#4668c8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#4668c8)"/><rect x="593.0" y="561" width="404" height="27" rx="4" fill="#f4f7fa" stroke="#f4f7fa"/><text x="795.0" y="582" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="17" fill="#17344d" font-weight="500" text-anchor="middle">Guidance update through network agents</text><circle cx="795" cy="656" r="4" fill="#087f83" stroke="none"/><path d="M795 656 H185" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><rect x="348.0" y="622" width="284" height="27" rx="4" fill="#f4f7fa" stroke="#f4f7fa"/><text x="490.0" y="643" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="17" fill="#17344d" font-weight="500" text-anchor="middle">Pre-arrival alert (~5 min)</text><rect x="49" y="724" width="1182" height="73" rx="12" fill="#e7f3f2" stroke="#bfdcd8"/><text x="71" y="755" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="22" fill="#087f83" font-weight="650" text-anchor="start">Decide → share → execute → report back</text><text x="71" y="782" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="16" fill="#536d81" font-weight="400" text-anchor="start">The specification leaves protocols and the physical placement of agents to implementation.</text><text x="40" y="837" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="16" fill="#536d81" font-weight="400" text-anchor="start">Illustrative sequence derived from the specification; no measured flight or communication trace is implied.</text></svg>