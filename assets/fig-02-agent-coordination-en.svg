roke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="173" y="834" width="509" height="27" fill="white"/><text x="427.5" y="857" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#111">Pre-arrival alert (approximately 5 min)</text><text x="56" y="993" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#111">Illustrative exchange sequence. Status reporting and guidance updates recur during flight.</text><text x="56" y="1019" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#111">Communication transport is omitted. APIs, message formats, and exact ordering are unspecified.</text><path d="M56 1041 H1064" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter"/><text x="560" y="1079" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="24" text-anchor="middle" font-weight="600" fill="#111">FIG. 2   AI agent coordination</text><text x="560" y="1112" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#111">Portfolio explanatory drawing</text></svg>
