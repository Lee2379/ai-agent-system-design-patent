<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="940" viewBox="0 0 1120 940" role="img" aria-labelledby="title desc" xml:lang="ja"><title id="title">FIG. 5 — 異常時の応答</title><desc id="desc">特許明細書に基づく説明図。構成要素番号は図面一覧に対応しています。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#111" stroke-width="1.3"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#111" stroke-width="1.3"/></marker></defs><rect width="1120" height="940" fill="white"/><text x="56" y="43" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#111">AI AGENT / SYSTEM DESIGN</text><text x="1064" y="43" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="16" text-anchor="end" font-weight="400" fill="#111">5 / 6</text><path d="M56 60 H1064" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter"/><rect x="100" y="110" width="920" height="75" fill="white" stroke="#111" stroke-width="1.8"/><text x="560" y="157" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="24" text-anchor="middle" font-weight="400" fill="#111">継続的な監視・通信経路の冗長化</text><path d="M560 185 V240 M215 240 H905 M215 240 V310 M560 240 V310 M905 240 V310" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter"/><rect x="75" y="310" width="280" height="100" fill="white" stroke="#111" stroke-width="1.8"/><text x="215.0" y="353.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#111">A</text><text x="215.0" y="385.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="21" text-anchor="middle" font-weight="400" fill="#111">障害物を検知</text><path d="M215 410 V490" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="75" y="490" width="280" height="120" fill="white" stroke="#111" stroke-width="1.8"/><text x="215" y="538" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">飛行経路を</text><text x="215" y="569" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">自動調整</text><text x="215" y="662" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#111">対象：人・車両など</text><text x="215" y="689" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#111">近傍の障害物</text><rect x="420" y="310" width="280" height="100" fill="white" stroke="#111" stroke-width="1.8"/><text x="560.0" y="353.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#111">B</text><text x="560.0" y="385.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="21" text-anchor="middle" font-weight="400" fill="#111">通信の喪失</text><path d="M560 410 V490" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="420" y="490" width="280" height="120" fill="white" stroke="#111" stroke-width="1.8"/><text x="560" y="538" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">基地への帰還</text><text x="560" y="569" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">または安全な着陸</text><text x="560" y="662" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#111">通信復旧・動作選択の</text><text x="560" y="689" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#111">条件は実装時に定義</text><rect x="765" y="310" width="280" height="100" fill="white" stroke="#111" stroke-width="1.8"/><text x="905.0" y="353.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#111">C</text><text x="905.0" y="385.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="21" text-anchor="middle" font-weight="400" fill="#111">電源の異常</text><path d="M905 410 V490" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="765" y="490" width="280" height="120" fill="white" stroke="#111" stroke-width="1.8"/><text x="905" y="538" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">基地への帰還</text><text x="905" y="569" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">または安全な着陸</text><text x="905" y="662" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#111">動作の実現可能性は</text><text x="905" y="689" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#111">残存電力・機体状態による</text><text x="56" y="793" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#111">A〜Cは独立した異常シナリオです。応答の選択条件は実装時に定めます。</text><text x="56" y="819" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#111">帰還・着陸には十分な電力と機体制御が必要です。完全な電力喪失への対策は別途検討します。</text><path d="M56 841 H1064" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter"/><text x="560" y="879" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="24" text-anchor="middle" font-weight="600" fill="#111">FIG. 5   異常時の応答</text><text x="560" y="912" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#111">システム説明図</text></svg>
