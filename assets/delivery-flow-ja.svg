<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">注文から学習までの配送フロー</title><desc id="desc">Six stages: request, assign, navigate, notify, deliver, learn. Notification target is approximately five minutes before arrival.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56828c"/></marker></defs><rect width="1200" height="320" rx="16" fill="#f4f7fa"/><text x="32" y="42" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="15" fill="#057f83" font-weight="650">04  配送ライフサイクル</text><text x="32" y="82" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="28" fill="#152a42" font-weight="650">注文から学習までの配送フロー</text><rect x="32" y="116" width="166" height="153" rx="12" fill="white" stroke="#cfdce5"/><text x="48" y="145" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="15" fill="#057f83" font-weight="650">01</text><text x="48" y="182" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="23" fill="#152a42" font-weight="650">注文</text><text x="48" y="215" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#4a6279" font-weight="400">注文を受付</text><text x="48" y="238" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#4a6279" font-weight="400">配送先を確認</text><path d="M202 193 L220 193" fill="none" stroke="#56828c" stroke-width="2" marker-end="url(#arrow)"/><rect x="226" y="116" width="166" height="153" rx="12" fill="white" stroke="#cfdce5"/><text x="242" y="145" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="15" fill="#057f83" font-weight="650">02</text><text x="242" y="182" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="23" fill="#152a42" font-weight="650">割当</text><text x="242" y="215" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#4a6279" font-weight="400">機体を選択</text><text x="242" y="238" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#4a6279" font-weight="400">経路を決定</text><path d="M396 193 L414 193" fill="none" stroke="#56828c" stroke-width="2" marker-end="url(#arrow)"/><rect x="420" y="116" width="166" height="153" rx="12" fill="white" stroke="#cfdce5"/><text x="436" y="145" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="15" fill="#057f83" font-weight="650">03</text><text x="436" y="182" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="23" fill="#152a42" font-weight="650">航行</text><text x="436" y="215" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#4a6279" font-weight="400">GPS・センサー</text><text x="436" y="238" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#4a6279" font-weight="400">衛星通信</text><path d="M590 193 L608 193" fill="none" stroke="#56828c" stroke-width="2" marker-end="url(#arrow)"/><rect x="614" y="116" width="166" height="153" rx="12" fill="white" stroke="#cfdce5"/><text x="630" y="145" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="15" fill="#057f83" font-weight="650">04</text><text x="630" y="182" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="23" fill="#152a42" font-weight="650">通知</text><text x="630" y="215" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#4a6279" font-weight="400">到着約5分前</text><text x="630" y="238" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#4a6279" font-weight="400">顧客へ連絡</text><path d="M784 193 L802 193" fill="none" stroke="#56828c" stroke-width="2" marker-end="url(#arrow)"/><rect x="808" y="116" width="166" height="153" rx="12" fill="white" stroke="#cfdce5"/><text x="824" y="145" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="15" fill="#057f83" font-weight="650">05</text><text x="824" y="182" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="23" fill="#152a42" font-weight="650">配送</text><text x="824" y="215" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#4a6279" font-weight="400">指定地点で</text><text x="824" y="238" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#4a6279" font-weight="400">荷物を受渡し</text><path d="M978 193 L996 193" fill="none" stroke="#56828c" stroke-width="2" marker-end="url(#arrow)"/><rect x="1002" y="116" width="166" height="153" rx="12" fill="white" stroke="#cfdce5"/><text x="1018" y="145" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="15" fill="#057f83" font-weight="650">06</text><text x="1018" y="182" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="23" fill="#152a42" font-weight="650">学習</text><text x="1018" y="215" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#4a6279" font-weight="400">運用データを</text><text x="1018" y="238" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#4a6279" font-weight="400">改善に再利用</text><text x="32" y="300" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#5c7184" font-weight="400">原文の想定動作を図示。5分は通知の目安であり、配送所要時間ではありません。</text></svg>