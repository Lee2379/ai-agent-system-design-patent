e-width="1.8"/><text x="822" y="254" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="400" fill="#111">Validate data quality</text><path d="M822 290 V355" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="647" y="355" width="350" height="90" fill="white" stroke="#111" stroke-width="1.8"/><text x="822" y="409" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="400" fill="#111">Evaluate candidate models</text><path d="M822 445 V510" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="647" y="510" width="350" height="90" fill="white" stroke="#111" stroke-width="1.8"/><text x="822" y="564" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="400" fill="#111">Approve and version releases</text><path d="M822 600 V665" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="647" y="665" width="350" height="90" fill="white" stroke="#111" stroke-width="1.8"/><text x="822" y="719" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="400" fill="#111">Monitor / support rollback</text><text x="56" y="883" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#111">The dashed enclosure shows a proposed process for model validation and release.</text><text x="56" y="909" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#111">Model placement, training schedules, and approval rules require detailed design.</text><path d="M56 931 H1064" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter"/><text x="560" y="969" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="24" text-anchor="middle" f