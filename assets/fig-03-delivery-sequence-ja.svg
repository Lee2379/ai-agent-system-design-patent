<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1065" viewBox="0 0 1120 1065" role="img" aria-labelledby="title desc" xml:lang="ja"><title id="title">FIG. 3 — 配送手順</title><desc id="desc">特許明細書に基づく説明図。構成要素番号は図面一覧に対応しています。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#111" stroke-width="1.3"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#111" stroke-width="1.3"/></marker></defs><rect width="1120" height="1065" fill="white"/><text x="56" y="43" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#111">AI AGENT / SYSTEM DESIGN</text><text x="1064" y="43" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="16" text-anchor="end" font-weight="400" fill="#111">3 / 6</text><path d="M56 60 H1064" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter"/><rect x="290" y="95" width="540" height="104" fill="white" stroke="#111" stroke-width="1.8"/><text x="560.0" y="140.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#111">S10</text><text x="560.0" y="172.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">配送要求を受信</text><path d="M560 199 V229" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="290" y="229" width="540" height="104" fill="white" stroke="#111" stroke-width="1.8"/><text x="560.0" y="258.5" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#111">S20</text><text x="560.0" y="290.5" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">配送先を確認</text><text x="560.0" y="321.5" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">機体を割り当て、経路を計画</text><path d="M560 333 V363" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="290" y="363" width="540" height="104" fill="white" stroke="#111" stroke-width="1.8"/><text x="560.0" y="392.5" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#111">S30</text><text x="560.0" y="424.5" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">GPS・センサーによる自律航行</text><text x="560.0" y="455.5" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">AIの誘導を継続的に受信</text><path d="M560 467 V497" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="290" y="497" width="540" height="104" fill="white" stroke="#111" stroke-width="1.8"/><text x="560.0" y="542.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#111">S40</text><text x="560.0" y="574.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">到着前の顧客通知</text><path d="M560 601 V631" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="290" y="631" width="540" height="104" fill="white" stroke="#111" stroke-width="1.8"/><text x="560.0" y="676.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#111">S50</text><text x="560.0" y="708.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">指定受取地点に配送</text><path d="M560 735 V765" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="290" y="765" width="540" height="104" fill="white" stroke="#111" stroke-width="1.8"/><text x="560.0" y="794.5" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#111">S60</text><text x="560.0" y="826.5" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">運用記録を保存し</text><text x="560.0" y="857.5" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">その後のAI改善に利用</text><path d="M830 550 H875" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter"/><text x="886" y="541" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="18" text-anchor="start" font-weight="400" fill="#111">到着の</text><text x="886" y="567" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="18" text-anchor="start" font-weight="400" fill="#111">約5分前</text><text x="56" y="918" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#111">S10〜S60は、注文から学習までの配送手順を示します。</text><text x="56" y="944" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#111">到着の約5分前に通知し、顧客が受け取りを準備できるようにします。</text><path d="M56 966 H1064" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter"/><text x="560" y="1004" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="24" text-anchor="middle" font-weight="600" fill="#111">FIG. 3   配送手順</text><text x="560" y="1037" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#111">システム説明図</text></svg>
