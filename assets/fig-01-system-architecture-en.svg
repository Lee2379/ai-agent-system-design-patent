<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1090" viewBox="0 0 1120 1090" role="img" aria-labelledby="title desc" xml:lang="en"><title id="title">FIG. 1 — System architecture</title><desc id="desc">System drawing based on the patent specification. Reference numbers match the drawing index; not an original patent-office drawing.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#111" stroke-width="1.3"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#111" stroke-width="1.3"/></marker></defs><rect width="1120" height="1090" fill="white"/><text x="56" y="43" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#111">AI AGENT / SYSTEM DESIGN</text><text x="1064" y="43" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="16" text-anchor="end" font-weight="400" fill="#111">1 / 6</text><path d="M56 60 H1064" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter"/><rect x="380" y="100" width="360" height="95" fill="white" stroke="#111" stroke-width="1.8"/><text x="560.0" y="140.5" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#111">110</text><text x="560.0" y="172.5" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">Customer platform</text><path d="M535 195 V273" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><path d="M585 273 V195" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><text x="515" y="237" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="18" text-anchor="end" font-weight="400" fill="#111">Order</text><t