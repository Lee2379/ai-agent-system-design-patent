 x="550.0" y="615.5" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#111">130</text><text x="550.0" y="647.5" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">Satellite communication</text><path d="M550 670 V750" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)" marker-start="url(#start)"/><rect x="380" y="750" width="340" height="95" fill="white" stroke="#111" stroke-width="1.8"/><text x="550.0" y="790.5" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#111">140</text><text x="550.0" y="822.5" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">Autonomous drone fleet</text><rect x="65" y="750" width="235" height="95" fill="white" stroke="#111" stroke-width="1.8"/><text x="182.5" y="790.5" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#111">170</text><text x="182.5" y="822.5" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">Delivery point</text><path d="M380 798 H300" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="835" y="575" width="235" height="125" fill="white" stroke="#111" stroke-width="1.8"/><text x="952.5" y="615.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#111">150</text><text x="952.5" y="647.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="400" fill="#111">Encrypted cloud DB</text><text x="952.5" y="678.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="400" fill="#111">Operational records</text><path d="M860 385 H952 V575" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><text x="970" y="490" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="18" text-anchor="start" font-weight="400" fill="#111">Store</text><rect x="835" y="750" width="235" height="95" fill="white" stroke="#111" stroke-width="1.8"/><text x="952.5" y="790.5" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#111">160</text><text x="952.5" y="822.5" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="21" text-anchor="middle" font-weight="400" fill="#111">AI improvement</text><path d="M952 700 V750" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><text x="56" y="943" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#111">Arrows show functional exchanges and delivery; they do not prescribe network wiring.</text><text x="56" y="969" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#111">GPS positioning is shown in Fig. 4. Agent deployment is an implementation decision.</text><path d="M56 991 H1064" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter"/><text x="560" y="1029" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="24" text-anchor="middle" font-weight="600" fill="#111">FIG. 1   System architecture</text><text x="560" y="1062" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#111">System design drawing</text></svg>
