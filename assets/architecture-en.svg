<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910" role="img" aria-labelledby="title desc"><title id="title">Multi-Agent AI for Autonomous Delivery</title><desc id="desc">Conceptual architecture redrawn from the inventor-provided specification. Fleet coordination and network cooperation connect customers, drones, and operational learning.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56828c"/></marker></defs><rect width="1200" height="910" rx="16" fill="#f4f7fa"/><path d="M16 0 H1184 Q1200 0 1200 16 V177 H0 V16 Q0 0 16 0" fill="#10283f"/><text x="40" y="41" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="15" fill="#78d5cf" font-weight="650">PATENT PORTFOLIO  /  AI &amp; SYSTEM DESIGN</text><text x="40" y="90" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="34" fill="#ffffff" font-weight="650">Multi-Agent AI for Autonomous Delivery</text><text x="40" y="132" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="18" fill="#c5d9e7" font-weight="400">ZA202509550B   •   CIPC 2025/09550   •   28 JAN 2026</text><text x="40" y="217" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="15" fill="#476174" font-weight="650">02  SYSTEM COMPONENTS &amp; RESPONSIBILITIES</text><rect x="398" y="247" width="404" height="391" rx="16" fill="#e7f3f2" stroke="#bddbd8"/><text x="420" y="278" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="17" fill="#056e72" font-weight="650">CENTRAL AI CONTROL SERVER</text><rect x="40" y="340" width="290" height="180" rx="12" fill="white" stroke="#cfdce5"/><rect x="40" y="358" width="4" height="144" rx="2" fill="#057f83"/><text x="62" y="378" font-family="Segoe UI, Yu Gothic, Meiryo, sans-serif" font-size="22" fill="#152a42" font-weight="650">Customer platform</text><text x="62" y="413" font-family="Segoe UI, Yu Gothic, Meiry