<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="940" viewBox="0 0 1120 940" role="img" aria-labelledby="title desc" xml:lang="en"><title id="title">FIG. 5 — Safety response scenarios</title><desc id="desc">Explanatory drawing based on the supplied specification. Editorial reference numerals; not an original patent-office drawing.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#111" stroke-width="1.3"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#111" stroke-width="1.3"/></marker></defs><rect width="1120" height="940" fill="white"/><text x="56" y="43" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#111">AI AGENT / SYSTEM DESIGN</text><text x="1064" y="43" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="16" text-anchor="end" font-weight="400" fill="#111">5 / 6</text><path d="M56 60 H1064" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter"/><rect x="100" y="110" width="920" height="75" fill="white" stroke="#111" stroke-width="1.8"/><text x="560" y="157" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="24" text-anchor="middle" font-weight="400" fill="#111">Continuous monitoring / redundant communication links</text><path d="M560 185 V240 M215 240 H905 M215 240 V310 M560 240 V310 M905 240 V310" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter"/><rect x="75" y="310" width="280" height="100" fill="white" stroke="#111" stroke-width="1.8"/><text x="215.0" y="353.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#111">A</text><text x="215.0" y="385.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="21" text-anchor="middle" font-weight="400" fill="#111">Obstacle detected</text><path d="M215 410 V490" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="75" y="490" width="280" height="120" fill="white" stroke="#111" stroke-width="1.8"/><text x="215" y="538" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">Adjust flight path</text><text x="215" y="569" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">to avoid obstacle</text><text x="215" y="662" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#111">Examples: nearby</text><text x="215" y="689" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#111">people or vehicles</text><rect x="420" y="310" width="280" height="100" fill="white" stroke="#111" stroke-width="1.8"/><text x="560.0" y="353.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#111">B</text><text x="560.0" y="385.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="21" text-anchor="middle" font-weight="400" fill="#111">Communication loss</text><path d="M560 410 V490" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="420" y="490" width="280" height="120" fill="white" stroke="#111" stroke-width="1.8"/><text x="560" y="538" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">Return to base</text><text x="560" y="569" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">or land safely</text><text x="560" y="662" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#111">Recovery and response</text><text x="560" y="689" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#111">criteria require definition</text><rect x="765" y="310" width="280" height="100" fill="white" stroke="#111" stroke-width="1.8"/><text x="905.0" y="353.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#111">C</text><text x="905.0" y="385.0" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="21" text-anchor="middle" font-weight="400" fill="#111">Power failure</text><path d="M905 410 V490" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="765" y="490" width="280" height="120" fill="white" stroke="#111" stroke-width="1.8"/><text x="905" y="538" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">Return to base</text><text x="905" y="569" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="22" text-anchor="middle" font-weight="400" fill="#111">or land safely</text><text x="905" y="662" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#111">Feasibility depends on</text><text x="905" y="689" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#111">power and aircraft state</text><text x="56" y="793" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#111">A–C are separate source scenarios; no priority or response-selection policy is specified.</text><text x="56" y="819" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#111">Return and landing are intended responses; feasibility after total loss of power is not established.</text><path d="M56 841 H1064" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter"/><text x="560" y="879" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="24" text-anchor="middle" font-weight="600" fill="#111">FIG. 5   Safety response scenarios</text><text x="560" y="912" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#111">Portfolio explanatory drawing</text></svg>
