<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="734" viewBox="0 0 1280 734" role="img" aria-labelledby="title desc" lang="en"><title id="title">Detect the change. Select an appropriate response.</title><desc id="desc">Connect safety behavior described in the specification with conditions to define during implementation.</desc><defs><marker id="087f83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087f83"/></marker><marker id="4668c8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4668c8"/></marker><marker id="ac6b17" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ac6b17"/></marker><marker id="536d81" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536d81"/></marker></defs><rect x="1" y="1" width="1278" height="732" rx="20" fill="#f4f7fa" stroke="#d5e1e8"/><text x="40" y="43" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#087f83" font-weight="700" text-anchor="start">05 / SAFETY RESPONSES</text><text x="40" y="88" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="32" fill="#17344d" font-weight="700" text-anchor="start">Detect the change. Select an appropriate response.</text><text x="40" y="123" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="18" fill="#536d81" font-weight="400" text-anchor="start">Connect safety behavior described in the specification with conditions to define during implementation.</text><text x="56" y="182" font-family="'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#536d81" font-weight="700" text-anchor="start">DETECTED CONDITION</text><text x="454" y="182" font-family="'Segoe UI', 'Yu Gothic', Mei