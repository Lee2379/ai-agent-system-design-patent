erif" font-size="18" text-anchor="middle" font-weight="400" fill="#111">配送要求・目的地</text><path d="M430 365 H690" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><text x="560.0" y="352" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#111">機体割当・経路</text><path d="M690 445 H955" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><text x="822.5" y="432" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#111">航行指示</text><path d="M955 525 H690" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><text x="822.5" y="512" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#111">位置・機体状態</text><path d="M690 605 H430" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><text x="560.0" y="592" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#111">調整に必要な情報</text><path d="M430 685 H690" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><text x="560.0" y="672" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#111">誘導情報の更新</text><path d="M690 765 H955" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><text x="822.5" y="752" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#111">更新された誘導情報</text><path d="M690 870 H165" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="173" y="834" width="509" height="27" fill="white"/><text x="427.5" y="857" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#111">到着前通知（約5分前）</text><text x="56" y="993" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#111">概念的な通信順序。飛行中の状態報告と誘導更新は必要に応じて繰り返します。</text><text x="56" y="1019" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#111">通信層は省略しています。API、メッセージ形式、厳密な処理順序は未指定です。</text><path d="M56 1041 H1064" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="miter"/><text x="560" y="1079" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="24" text-anchor="middle" font-weight="600" fill="#111">FIG. 2   AIエージェント間の連携</text><text x="560" y="1112" font-family="Arial, 'Yu Gothic', Meiryo, sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#111">システム説明図</text></svg>
